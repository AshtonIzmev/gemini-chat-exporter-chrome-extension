name: Security and integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-gates:
    name: Tests, audit, and package integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install development dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Enforce security invariants
        run: npm run security:check

      - name: Run tests
        run: npm test

      - name: Build reproducible runtime package
        run: npm run package

      - name: Publish package checksums
        run: |
          archive=$(find . -maxdepth 1 -name 'gemini-chat-exporter-v*.zip' -print -quit)
          sha256sum "$archive" | tee SHA256SUMS
          md5sum "$archive" | tee MD5SUMS
          {
            echo '## Runtime package checksums'
            echo '```text'
            cat SHA256SUMS MD5SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reviewed runtime package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gemini-chat-exporter-runtime-${{ github.sha }}
          path: |
            gemini-chat-exporter-v*.zip
            SHA256SUMS
            MD5SUMS
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: javascript-typescript

      - name: Analyze source
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
